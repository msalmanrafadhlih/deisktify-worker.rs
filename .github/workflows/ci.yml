name: CI

# - pull_request: cek saja (fmt, clippy, test, wasm32, fixture, SQL).
# - push tag `v*`: cek yang sama, lalu job `migrate` menerapkan migrasi dan seed
#   konten ke database Turso production (hanya kalau semua cek hijau), lalu job
#   `deploy` mengirim Worker ke Cloudflare (hanya kalau `migrate` berhasil).
# - workflow_dispatch (tombol "Run workflow" di tab Actions, hanya dari `main`):
#   hanya `migrate`; TIDAK men-deploy. Dipakai untuk menjalankan ulang migrasi
#   tanpa tag baru. Deploy selalu dari tag.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: fmt + clippy + test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi harus sama dengan rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warning = error)
        # Crate `api` ikut di-check di host: crate `worker` compile di sini,
        # jadi tipe dan logika murninya terperiksa dan dites.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  wasm:
    name: wasm32 (target Worker sebenarnya)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy untuk wasm32
        run: cargo clippy -p api --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Build release wasm32
        run: cargo build -p api --target wasm32-unknown-unknown --release --locked

      - name: Ukuran wasm
        # Plan gratis Workers membatasi ukuran Worker; angka ini untuk dipantau.
        run: ls -l target/wasm32-unknown-unknown/release/api.wasm

      - name: worker-build (wasm-bindgen + wasm-opt, persis seperti wrangler)
        working-directory: crates/api
        run: |
          cargo install worker-build --version 0.8.7 --locked
          worker-build --release
          ls -l build/worker

  reference-fixtures:
    name: fixture sesuai klien referensi Turso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang klien referensi (versi dipin, tanpa lifecycle script)
        run: |
          mkdir "$RUNNER_TEMP/hrana" && cd "$RUNNER_TEMP/hrana"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @libsql/hrana-client@0.10.0

      - name: Bangkitkan ulang fixture dan validasi respons
        run: node scripts/gen_golden.mjs
        env:
          HRANA_CLIENT_DIR: ${{ runner.temp }}/hrana/node_modules/@libsql/hrana-client

      - name: Fixture tidak boleh berubah
        run: git diff --exit-code -- crates/turso-http/tests/fixtures

  sql:
    name: migrasi + seed di SQLite sungguhan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite tanpa flag butuh Node >= 22.13
          node-version: 22

      - name: Terapkan migrasi dan seed, uji constraint
        run: node --test scripts/migrations.test.mjs

      - name: Dashboard admin (logika, klien API, CSP, pustaka bawaan)
        run: node --test scripts/admin-ui.test.mjs

      - name: Workflow ini sendiri (urutan migrate -> deploy, rahasia, versi dipin)
        run: node --test scripts/workflow.test.mjs

  migrate:
    name: migrasi + seed ke Turso (production)
    needs: [native, wasm, reference-fixtures, sql]
    # Tidak pernah jalan di pull request. `workflow_call` bukan push/dispatch,
    # jadi tidak ikut.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Secret boleh disimpan sebagai repository secret atau environment secret
    # "production". Di Settings > Environments > production kamu bisa menambah
    # "Required reviewers" kalau ingin persetujuan manual sebelum menyentuh DB.
    environment: production
    # Dua migrasi tidak boleh jalan bersamaan; yang kedua menunggu, bukan batal.
    concurrency:
      group: turso-migrate
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Nilainya HARUS sama dengan secret Worker (`wrangler secret put ...`),
      # kalau tidak Worker membaca database yang berbeda dari yang dimigrasi.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Periksa secret dan sembunyikan nama host dari log
        # Repo ini publik, log Actions juga publik. GitHub hanya menyamarkan
        # nilai secret persis; alat `migrate` mencetak alamat yang sudah
        # dinormalkan (libsql:// jadi https://), jadi hostnya disamarkan sendiri.
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::Secret TURSO_DATABASE_URL dan/atau TURSO_AUTH_TOKEN belum di-set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          host="${TURSO_DATABASE_URL#*://}"
          host="${host%%/*}"
          host="${host##*@}"
          host="${host%%:*}"
          echo "::add-mask::$host"

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Build alat migrate
        run: cargo build -p migrate --release --locked

      - name: Status sebelum
        run: ./target/release/migrate status

      - name: Terapkan migrasi (satu transaksi per migrasi)
        run: ./target/release/migrate up --yes

      - name: Seed konten situs (tanpa --samples; hanya berlaku sekali, aman diulang)
        run: ./target/release/migrate seed --yes

      - name: Status sesudah (harus "up to date")
        run: ./target/release/migrate status

  deploy:
    name: deploy Worker ke Cloudflare (production)
    # Setelah `migrate`: Worker baru tidak boleh tayang sebelum skemanya ada.
    # `needs` saja sudah melewati job ini kalau `migrate` gagal atau dilewati,
    # tetapi syaratnya ditulis lagi supaya niatnya terbaca: hanya dari tag, tidak
    # pernah dari pull request atau tombol "Run workflow".
    needs: [migrate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Secret `CLOUDFLARE_*` boleh repository secret atau environment secret
    # "production" (environment yang sama dengan `migrate`, jadi "Required
    # reviewers" di sana juga menjaga deploy).
    environment: production
    # Dua deploy tidak boleh bersamaan; yang kedua menunggu, bukan membatalkan.
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Hanya dua ini yang diketahui CI. Rahasia Worker (ADMIN_TOKEN, TURSO_*,
      # GITHUB_TOKEN, RATE_LIMIT_SALT, BANNED_WORDS) tetap di Cloudflare
      # (`wrangler secret put`); `wrangler deploy` tidak menyentuhnya.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Versi wrangler dipin persis (tidak `latest`, tidak rentang; ada tesnya).
      # Dirilis 2026-10-14, setelah `compatibility_date` di crates/api/wrangler.toml
      # (2026-10-01), jadi runtime workerd-nya mengenal tanggal itu. Naikkan
      # sengaja, lalu cek log deploy.
      WRANGLER_VERSION: "4.151.0"
    steps:
      - uses: actions/checkout@v4

      - name: Periksa secret Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN dan/atau CLOUDFLARE_ACCOUNT_ID belum di-set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Pasang worker-build (versi sama dengan job wasm dan wrangler.toml)
        run: cargo install worker-build --version 0.8.7 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy (wrangler menjalankan worker-build, lalu mengunggah Worker dan dashboard /admin/)
        working-directory: crates/api
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy

      - name: Cek Worker yang baru tayang
        # Opsional: isi variable repo `API_BASE_URL` (https://host, tanpa path;
        # sama dengan variable di repo frontend). Isinya alamat publik, bukan rahasia.
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::notice::Variable API_BASE_URL belum di-set; cek /health dan /admin/ dilewati."
            exit 0
          fi
          # Worker baru butuh beberapa detik untuk menyebar; ulangi dulu.
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null -w "health: HTTP %{http_code}\n" "$API_BASE_URL/api/v1/health"
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null -w "admin: HTTP %{http_code}\n" "$API_BASE_URL/admin/"
