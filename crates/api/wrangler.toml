# Worker tquilla-api. Semua perintah wrangler dijalankan dari folder ini
# (crates/api): `worker-build` membangun crate di folder kerja dan menulis
# hasilnya ke ./build.
name = "tquilla-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
# Pasang sekali: cargo install worker-build --version 0.8.7 --locked
command = "worker-build --release"
watch_dir = "src"

[triggers]
# Ambil statistik GitHub untuk halaman /profile tiap 6 jam (UTC). Plan gratis:
# maksimal 5 cron per akun dan CPU 10 ms per eksekusi. Butuh secret GITHUB_TOKEN.
crons = ["0 */6 * * *"]

[assets]
# Dashboard admin (D6a): berkas statis di ../../web dilayani Worker yang sama, jadi
# satu origin dengan API (tanpa CORS). Alamatnya /admin/. Yang cocok dengan sebuah
# berkas dilayani langsung (gratis, tanpa menjalankan kode Worker); sisanya
# (mis. /api/...) masuk ke Worker. Header berkas ini ada di web/_headers.
directory = "../../web"

[vars]
# Origin browser yang boleh memanggil API, dipisah koma. Persis: skema + host
# (+ port), tanpa path, tanpa wildcard. Origin yang tidak valid dibuang.
ALLOWED_ORIGINS = "https://tquilla.is-a.dev"

# Rahasia JANGAN ditulis di sini. Set lewat:
#   npx wrangler secret put TURSO_AUTH_TOKEN
#   npx wrangler secret put TURSO_DATABASE_URL     (atau isi sebagai [vars] di sini)
#   npx wrangler secret put RATE_LIMIT_SALT        (openssl rand -hex 32)
#   npx wrangler secret put ADMIN_TOKEN            (openssl rand -hex 32; kosong = admin mati)
#   npx wrangler secret put GITHUB_TOKEN           (token GitHub, scope read:user; untuk cron jurnal)
# Untuk `wrangler dev`, isi crates/api/.dev.vars (lihat .dev.vars.example).
